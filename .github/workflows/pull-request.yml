# This is temporary action for clients test.

name: pull-request
on:
  push:
    branches: [ dev, "release-**" ]
  pull_request:
    branches: [ dev, "release-**" ]

jobs:
  java-client:
    runs-on: [ self-hosted, linux ]

    steps:
      - name: Clean runner
        uses: webiny/action-post-run@3.1.0
        with:
          run: find . -mindepth 1 -delete

      - uses: actions/checkout@v4

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.2

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.JAVA_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: install nebula
        run: |
          docker compose pull && docker compose up -d
          sleep 40
        working-directory: docker-compose

      - name: install nebula-ssl
        run: |
          docker compose pull && docker compose up -d
          sleep 40
        working-directory: docker-compose-ssl

      - name: compile the client
        run: |
          mvn clean package

      - name: stop nebula
        if: always()
        run: |
          docker compose down
        working-directory: docker-compose

      - name: stop nebula-ssl
        if: always()
        run: |
          docker compose down
        working-directory: docker-compose-ssl

            
